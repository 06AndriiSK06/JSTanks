name: CI & Release Pipeline

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm --workspace=@jstanks/shared run build && npm --workspace=@jstanks/server run build && npm --workspace=@jstanks/client run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build & verify Docker image (< 200 MB & SIGTERM < 10s)
        run: |
          docker build --build-arg GIT_SHA=${{ github.sha }} -t jstanks:ci .
          SIZE_BYTES=$(docker image inspect jstanks:ci --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Docker image size: ${SIZE_MB} MB"
          test "$SIZE_MB" -lt 200
          docker run -d --name jstanks-ci -p 3000:3000 jstanks:ci
          sleep 2
          curl -fsSL http://127.0.0.1:3000/health
          curl -fsSL http://127.0.0.1:3000/ready
          curl -fsSL http://127.0.0.1:3000/metrics | head -n 10
          START_TS=$(date +%s)
          docker stop -t 10 jstanks-ci
          END_TS=$(date +%s)
          STOP_SEC=$((END_TS - START_TS))
          echo "Graceful stop duration: ${STOP_SEC}s"
          test "$STOP_SEC" -lt 10
          docker rm jstanks-ci

  deploy:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Trigger hosting deploy hook (optional)
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
