<svg xmlns="http://www.w3.org/2000/svg" width="384" height="64" viewBox="0 0 384 64"><title>JSTanks Sprite Sheet</title>
  <!-- 0: Tank Normal (0..64) -->
  <g transform="translate(32,32)">
    <rect x="-20" y="-17" width="40" height="6" rx="2" fill="#334155"/>
    <rect x="-20" y="11" width="40" height="6" rx="2" fill="#334155"/>
    <rect x="-16" y="-11" width="32" height="22" rx="4" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
    <rect x="4" y="-3" width="22" height="6" rx="1" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="8" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  </g>
  <!-- 1: Tank Rapid (64..128) -->
  <g transform="translate(96,32)">
    <rect x="-20" y="-17" width="40" height="6" rx="2" fill="#334155"/>
    <rect x="-20" y="11" width="40" height="6" rx="2" fill="#334155"/>
    <rect x="-16" y="-11" width="32" height="22" rx="4" fill="#a855f7" stroke="#7e22ce" stroke-width="2"/>
    <rect x="4" y="-3" width="22" height="6" rx="1" fill="#f8fafc"/>
    <circle cx="0" cy="0" r="8" fill="#9333ea" stroke="#581c87" stroke-width="2"/>
  </g>
  <!-- 2: Shell Bullet (128..192) -->
  <g transform="translate(160,32)">
    <circle cx="0" cy="0" r="7" fill="rgba(56,189,248,0.3)"/>
    <circle cx="0" cy="0" r="4.5" fill="#38bdf8"/>
    <circle cx="1.5" cy="-1.5" r="1.5" fill="#e0f2fe"/>
  </g>
  <!-- 3: Homing Missile (192..256) -->
  <g transform="translate(224,32)">
    <polygon points="12,0 -8,-6 -5,0 -8,6" fill="#f43f5e" stroke="#ffe4e6" stroke-width="1"/>
    <circle cx="-8" cy="0" r="3" fill="#fde047"/>
  </g>
  <!-- 4: Asteroid Standard (256..320) -->
  <g transform="translate(288,32)">
    <polygon points="24,0 16,18 -4,24 -22,12 -24,-8 -10,-22 12,-20" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="-6" cy="-5" r="4" fill="#0f172a"/>
    <circle cx="8" cy="7" r="3" fill="#0f172a"/>
  </g>
  <!-- 5: Asteroid Seeker Drone (320..384) -->
  <g transform="translate(352,32)">
    <polygon points="24,0 16,18 -4,24 -22,12 -24,-8 -10,-22 12,-20" fill="#3f1d2e" stroke="#f43f5e" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#f43f5e"/>
  </g>
</svg>
